[project]
name = "pastetalk-engine"
version = "2.0.0"
description = "Локальный движок распознавания речи для PasteTalk"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.1.0",
    "numpy>=2.0",
    "huggingface-hub>=0.26",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11"]

[tool.uv]
package = false
