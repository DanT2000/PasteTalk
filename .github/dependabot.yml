# Dependabot: следим за уязвимыми зависимостями, не заваливая репозиторий
# пулреквестами — лимиты нарочно маленькие, обновления раз в неделю.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: [dependencies]

  - package-ecosystem: pip
    directory: /engine
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels: [dependencies]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
