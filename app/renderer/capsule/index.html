<!doctype html>
<html lang="ru" data-theme="dark" data-scale="100" data-size="full">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; font-src 'self'">
<title>PasteTalk</title>
<link rel="stylesheet" href="capsule.css">
</head>
<body>

<div class="capsule" id="cap" data-tone="live" data-wave="live">
  <div class="cap-row">
    <!-- Боковые группы одной ширины: только так микрофон стоит ровно
         посередине панели, а не съезжает к краю. -->
    <div class="cap-side">
      <!-- Прошлая диктовка: вернуться к сказанному, когда буфер обмена
           уже занят другим. -->
      <button class="cap-btn" id="last" title="Взять прошлый текст и причесать">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v4l3 2"/></svg>
      </button>
      <button class="cap-btn" id="prefs" title="Настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
    </div>

    <div class="wave left" data-bars></div>

    <button class="cap-mic" id="mic" title="Начать или закончить запись">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" id="mic-icon"></svg>
      <!-- Пока идёт работа, наведение превращает кнопку в отмену. -->
      <svg class="cap-mic-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>

    <div class="wave right" data-bars></div>

    <div class="cap-side">
      <button class="cap-btn" id="ai" title="Улучшить текст">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18.5 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg>
      </button>

      <!-- Один выход из любого состояния: идёт запись — бросит, думает
           модель — оборвёт, всё готово — просто закроет панель. -->
      <button class="cap-btn cap-x" id="close" title="Отменить и закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="cap-bar"></div>

  <div class="cap-foot">
    <span class="cap-status" id="status">Говорите</span>
    <span class="cap-hint" id="hint"></span>
    <span class="cap-timer" id="timer"></span>
  </div>
</div>

<script src="../shared/i18n.js"></script>
<script src="../shared/sounds.js"></script>
<script src="capsule.js"></script>
</body>
</html>
