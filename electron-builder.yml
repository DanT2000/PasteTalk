appId: ru.appswire.pastetalk
productName: PasteTalk
copyright: © 2026 DanT2000. MIT — с указанием авторства.

directories:
  output: release
  buildResources: build

# В сборку идёт только то, что нужно на чужом компьютере: макеты,
# скрипты сборки и окружение движка остаются в репозитории.
files:
  - app/**/*
  # Общие промпты улучшения: без этой строки установленное приложение
  # не нашло бы shared/modes.js и падало на первом же улучшении.
  - shared/**/*
  - package.json
  - '!**/*.map'

extraResources:
  # Собранный движок ложится рядом с приложением. Приложение ищет его
  # по этому пути первым, а venv из репозитория — только в разработке.
  - from: build/engine
    to: engine
    filter: ['**/*']
  # Значок трея нужен в готовом виде: рисовать его на лету нечем.
  - from: build/tray.ico
    to: build/tray.ico
  - from: build/icon.ico
    to: build/icon.ico

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    # Портативная версия: один exe, все данные — в папке «PasteTalk data»
    # рядом с ним. Устанавливать ничего не нужно, переезжает на флешке.
    - target: portable
      arch: [x64]
  # Подписи нет: сертификат стоит денег, а без него SmartScreen всё равно
  # ругается один раз. В README написано, что нажать.
  signAndEditExecutable: true

portable:
  artifactName: PasteTalk-${version}-Portable.${ext}

nsis:
  oneClick: false
  perMachine: false
  # Имя программы к выбранной папке electron-builder дописывает сам:
  # выберете D:\Programs — окажется D:\Programs\PasteTalk.
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PasteTalk
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: PasteTalk-${version}-Setup.${ext}
  # Оставляем русский первым: программа русскоязычная.
  installerLanguages: [ru_RU, en_US]
  language: '1049'

publish:
  provider: github
  owner: DanT2000
  repo: PasteTalk
